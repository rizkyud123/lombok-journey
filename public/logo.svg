<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4B4" />
      <stop offset="100%" stop-color="#112D4E" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E5A92B" />
      <stop offset="100%" stop-color="#F2C94C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- Background Circle Mask / Base (Transparent or Light) -->
  
  <!-- Outer Gold Top Ring Arc -->
  <path d="M 110,250 A 155,155 0 0,1 390,250" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Rising Sun -->
  <circle cx="330" cy="170" r="32" fill="url(#sunGrad)" />

  <!-- Flying Birds -->
  <path d="M 285,115 Q 292,108 299,115 Q 306,108 313,115 Q 306,111 299,116 Q 292,111 285,115 Z" fill="#112D4E" />
  <path d="M 315,128 Q 321,122 327,128 Q 333,122 339,128 Q 333,125 327,129 Q 321,125 315,128 Z" fill="#112D4E" />
  <path d="M 340,140 Q 345,135 350,140 Q 355,135 360,140 Q 355,137 350,141 Q 345,137 340,140 Z" fill="#112D4E" />

  <!-- Mountain Range (Rinjani Peak) -->
  <!-- Mountain Shadow Body -->
  <path d="M 150,225 L 260,130 L 310,185 L 400,225 Z" fill="#112D4E" />
  <!-- Mountain Highlight Facets (Snow & Light) -->
  <path d="M 260,130 L 230,225 M 260,130 L 275,180 L 290,225 M 260,130 L 220,180" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="260,130 245,155 255,160 250,180 268,165 260,130" fill="#FFFFFF" opacity="0.9" />

  <!-- Shore & Sand -->
  <path d="M 140,230 Q 220,220 300,232 Q 350,230 400,228 L 400,240 Q 350,242 300,240 Q 220,235 140,242 Z" fill="#E8CD94" />

  <!-- Turquoise Ocean Waves -->
  <path d="M 130,236 Q 220,222 310,234 Q 355,228 400,228 L 400,250 Q 320,255 240,248 Q 180,248 130,242 Z" fill="url(#oceanGrad)" />
  <path d="M 140,244 Q 230,232 320,244 Q 360,240 400,242 L 400,252 Q 320,256 240,252 Q 180,252 140,248 Z" fill="#30E3CA" opacity="0.8" />

  <!-- Palm Trees (Left Foreground) -->
  <g fill="#112D4E">
    <!-- Big Palm Trunk -->
    <path d="M 115,245 Q 128,180 160,105 Q 166,105 160,112 Q 133,180 123,245 Z" />
    <!-- Big Palm Leaves -->
    <path d="M 160,108 Q 120,70 80,110 Q 120,90 160,108 Z" />
    <path d="M 160,108 Q 140,50 110,35 Q 135,60 160,108 Z" />
    <path d="M 160,108 Q 180,50 215,35 Q 185,60 160,108 Z" />
    <path d="M 160,108 Q 205,70 235,115 Q 190,95 160,108 Z" />
    <path d="M 160,108 Q 190,120 220,150 Q 180,125 160,108 Z" />
    <path d="M 160,108 Q 130,125 90,145 Q 125,125 160,108 Z" />

    <!-- Small Palm Trunk -->
    <path d="M 105,245 Q 118,200 140,155 Q 144,155 140,160 Q 122,200 112,245 Z" />
    <!-- Small Palm Leaves -->
    <path d="M 140,157 Q 105,130 75,160 Q 105,145 140,157 Z" />
    <path d="M 140,157 Q 125,115 100,105 Q 120,125 140,157 Z" />
    <path d="M 140,157 Q 160,115 185,105 Q 160,125 140,157 Z" />
    <path d="M 140,157 Q 175,135 195,165 Q 165,148 140,157 Z" />
  </g>

  <!-- Typography Section -->
  
  <!-- LOMBOK Main Brand Text -->
  <text x="250" y="325" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="900" font-size="62" fill="#112D4E" text-anchor="middle" letter-spacing="4">LOMBOK</text>

  <!-- JOURNEY Subtitle -->
  <!-- Left & Right Gold Line for Journey -->
  <line x1="75" y1="344" x2="135" y2="344" stroke="url(#goldGrad)" stroke-width="2.5" />
  <text x="250" y="353" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#D4AF37" text-anchor="middle" letter-spacing="10">JOURNEY</text>
  <line x1="365" y1="344" x2="425" y2="344" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- TOUR AND TRAVEL Subtitle -->
  <line x1="120" y1="371" x2="145" y2="371" stroke="#112D4E" stroke-width="1.5" />
  <text x="250" y="376" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="14" fill="#112D4E" text-anchor="middle" letter-spacing="4">TOUR AND TRAVEL</text>
  <line x1="355" y1="371" x2="380" y2="371" stroke="#112D4E" stroke-width="1.5" />

  <!-- Bottom Arch & Turquoise Waves -->
  <path d="M 90,350 A 165,165 0 0,0 410,350" fill="none" stroke="#112D4E" stroke-width="3" />
  <path d="M 130,395 Q 250,440 370,395 Q 290,455 210,425 Z" fill="#00C4B4" />
  <path d="M 140,410 Q 250,460 360,405 Q 270,470 180,432 Z" fill="#112D4E" />
</svg>
